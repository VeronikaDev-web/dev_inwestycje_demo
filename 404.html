<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>404 – Strona nie istnieje</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      animation: fadeIn 0.7s ease;
      padding: 30px;
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    p {
      font-size: 20px;
      margin-bottom: 30px;
      color: #555;
    }

    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 10px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      transition: 0.3s;
    }

    a:hover {
      background: #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>404</h1>
    <p>Wygląda na to, że ta strona nie istnieje.</p>
    <a href="index.html">Wróć na stronę główną</a>
  </div>
</body>
</html>
